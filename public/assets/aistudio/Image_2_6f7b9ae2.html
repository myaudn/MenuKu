<!DOCTYPE html>

<html lang="id"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#fafaf4;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-secondary-fixed": "#311300", "on-error-container": "#93000a", "secondary": "#964900", "on-primary-fixed-variant": "#005312", "tertiary": "#006418", "outline-variant": "#bfcaba", "surface-container-low": "#f4f4ee", "on-primary-fixed": "#002204", "on-surface": "#1a1c19", "surface-container-highest": "#e3e3de", "on-tertiary-fixed": "#002204", "background": "#fafaf4", "surface-container-high": "#e8e8e3", "on-tertiary-container": "#ccffc3", "primary-container": "#2e7d32", "primary-fixed": "#a3f69c", "on-primary": "#ffffff", "on-background": "#1a1c19", "surface": "#fafaf4", "surface-variant": "#e3e3de", "surface-container": "#eeeee9", "error": "#ba1a1a", "surface-dim": "#dadad5", "on-primary-container": "#cbffc2", "on-secondary": "#ffffff", "surface-bright": "#fafaf4", "on-tertiary": "#ffffff", "secondary-fixed": "#ffdcc6", "inverse-primary": "#88d982", "error-container": "#ffdad6", "outline": "#707a6c", "on-surface-variant": "#40493d", "surface-tint": "#1b6d24", "primary-fixed-dim": "#88d982", "tertiary-container": "#267e2e", "tertiary-fixed-dim": "#82db7e", "on-tertiary-fixed-variant": "#005312", "on-secondary-container": "#5e2c00", "secondary-container": "#fc820c", "on-secondary-fixed-variant": "#723600", "tertiary-fixed": "#9df898", "surface-container-lowest": "#ffffff", "primary": "#0d631b", "inverse-on-surface": "#f1f1ec", "inverse-surface": "#2f312e", "on-error": "#ffffff", "secondary-fixed-dim": "#ffb786" }, borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, spacing: { "margin-tablet": "1.5rem", "gutter-sm": "0.75rem", "margin": "1rem", "space-lg": "1.5rem", "gutter": "1rem", "space-xs": "0.25rem", "space-md": "1rem", "space-xl": "2rem", "space-sm": "0.5rem" }, fontFamily: { "body-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "headline-lg-mobile": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"] }, fontSize: { "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }], "headline-md": ["22px", { lineHeight: "28px", fontWeight: "600" }], "label-sm": ["10px", { lineHeight: "14px", fontWeight: "600" }], "headline-lg-mobile": ["26px", { lineHeight: "34px", fontWeight: "700" }], "label-md": ["12px", { lineHeight: "16px", fontWeight: "600" }], "display-lg": ["44px", { lineHeight: "52px", fontWeight: "800" }], "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }], "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }], "headline-sm": ["18px", { lineHeight: "24px", fontWeight: "600" }], "label-lg": ["14px", { lineHeight: "20px", fontWeight: "600" }], "headline-lg": ["32px", { lineHeight: "40px", fontWeight: "700" }] } } } };</script></head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col w-full bg-surface"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Top Welcome & Branding Section -->
<div class="flex flex-col items-center text-center mt-space-md mb-space-lg">
<div class="relative flex items-center justify-center w-24 h-24 rounded-full bg-surface-container-low shadow-sm p-space-sm mb-space-md">
<div class="absolute -top-1 -right-1 w-6 h-6 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary shadow-sm">
<span class="material-symbols-outlined text-[14px]">soup_kitchen</span>
</div>
<img alt="Logo MenuKu" class="w-20 h-20 object-contain rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAVmUClN7xCIyDJHKJ3WXBBFZAa4bEITXGFfXZ0iNdIOJ_fD9C5W5Imss-_bG05zBCVOTClEbbyuBkQE1CFKn9ak0Tobh-3btyc6tnFkJccsuNQks-r_7S0Hp5xQIh90t6lhy6sVujwcIgkkR3O50-YGDtXRbVpKA9_kmgf-iVKVAXtNpiRJEgxjzsoXJH39DuLDQLZ4yI2zQ1W12-Qn5l-oUwZ0X1-E-h6Q1q7UDI-"/>
</div>
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-primary-fixed text-on-primary-fixed mb-space-xs shadow-sm">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">eco</span>
<span class="font-label-sm text-label-sm tracking-wide">DAPUR CERDAS &amp; SEHAT</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-space-xs">
      Selamat Datang di MenuKu
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
      Kelola resep, rencana makan, dan bahan dapur dengan mudah
    </p>
</div>
<!-- Login Card Form Container -->
<div class="w-full bg-surface-container-lowest rounded-lg p-space-md shadow-sm mb-space-lg">
<form class="flex flex-col gap-space-md" id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
<!-- Input Email Field -->
<div class="flex flex-col gap-1.5 text-left">
<label class="font-label-md text-label-md text-on-surface font-semibold flex items-center gap-1" for="email">
<span>Alamat Email</span>
</label>
<div class="relative flex items-center w-full bg-surface-container-low rounded-xl px-space-md py-3 focus-within:bg-surface-container-lowest focus-within:shadow-md transition-all duration-200">
<span class="material-symbols-outlined text-outline mr-3 text-[20px] select-none">mail</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline outline-none focus:outline-none" id="email" placeholder="contoh@email.com" required="" type="email"/>
</div>
</div>
<!-- Input Password Field -->
<div class="flex flex-col gap-1.5 text-left">
<label class="font-label-md text-label-md text-on-surface font-semibold flex items-center gap-1" for="password">
<span>Kata Sandi</span>
</label>
<div class="relative flex items-center w-full bg-surface-container-low rounded-xl px-space-md py-3 focus-within:bg-surface-container-lowest focus-within:shadow-md transition-all duration-200">
<span class="material-symbols-outlined text-outline mr-3 text-[20px] select-none">lock</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline outline-none focus:outline-none" id="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Tampilkan atau sembunyikan kata sandi" class="text-outline hover:text-on-surface flex items-center justify-center p-1 rounded-full transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
<!-- Tautan Lupa Sandi -->
<div class="flex justify-end mt-1">
<a class="font-label-md text-label-md text-primary font-semibold hover:underline inline-flex items-center gap-0.5" href="#">
            Lupa Kata Sandi?
          </a>
</div>
</div>
<!-- Tombol Masuk Utama -->
<button class="relative overflow-hidden w-full h-12 bg-primary-container hover:bg-primary active:scale-[0.98] text-on-primary font-label-lg text-label-lg rounded-full flex items-center justify-center gap-2 shadow-md hover:shadow-lg transition-all duration-200 cursor-pointer mt-space-xs" id="submitBtn" type="submit">
<span class="material-symbols-outlined text-[20px]">login</span>
<span class="tracking-wide">MASUK</span>
</button>
</form>
</div>
<!-- Divider MD3 -->
<div class="relative flex items-center justify-center w-full my-space-sm">
<div class="w-full h-[1px] bg-surface-container-high"></div>
<span class="absolute bg-surface px-4 font-body-sm text-body-sm text-on-surface-variant">
      atau masuk dengan
    </span>
</div>
<!-- Social Google Button -->
<div class="w-full mt-space-md mb-space-lg">
<button class="w-full h-12 bg-surface-container-lowest hover:bg-surface-container-low active:scale-[0.98] text-on-surface font-label-lg text-label-lg rounded-full flex items-center justify-center gap-3 shadow-sm hover:shadow transition-all duration-200 cursor-pointer" type="button">
<svg class="w-5 h-5 flex-shrink-0" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.03 0 12s.45 3.82 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
<span>Lanjutkan dengan Google</span>
</button>
</div>
<!-- Bottom Registration Link -->
<div class="text-center font-body-md text-body-md text-on-surface-variant flex items-center justify-center gap-1">
<span>Belum punya akun?</span>
<a class="font-label-lg text-label-lg text-secondary hover:underline font-bold" href="#">
      Daftar akun
    </a>
</div>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('password');
    const toggleButton = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const submitBtn = document.getElementById('submitBtn');

    if (toggleButton && passwordInput && eyeIcon) {
      toggleButton.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    window.handleLogin = function() {
      if (submitBtn) {
        submitBtn.innerHTML = `
          <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span class="tracking-wide">MEMVERIFIKASI...</span>
        `;
        setTimeout(() => {
          submitBtn.innerHTML = `
            <span class="material-symbols-outlined text-[20px]">check</span>
            <span class="tracking-wide">BERHASIL</span>
          `;
          submitBtn.classList.remove('bg-primary-container');
          submitBtn.classList.add('bg-tertiary');
        }, 1200);
      }
    };
  })();
</script></main></body></html>
